<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <title>Slider</title>
  </head>
  <body>
    <div class="titles">
      <h1 class="main-title">Image Carousel</h1>
      <h1 class="background-title">Image Carousel</h1>
    </div>
    <div class="slider">
      <button class="prev"><i class="fa-solid fa-angle-left"></i></button>
      <div class="slide-window">
        <div class="slides"></div>
      </div>
      <div class="dots"></div>
      <button class="next"><i class="fa-solid fa-angle-right"></i></button>
      <button class="follow">Follow</button>
      <div class="decor decor-3"></div>
      <div class="decor decor-4"></div>
    </div>

    <div class="decor decor-1"></div>
    <div class="decor decor-2"></div>

    <div class="union">
      <img src="Images/Union.png" alt="vincent" />
    </div>
  </body>
</html>
